# Listen for Fluent Bit forward protocol with TLS
<source>
  @type forward
  port 24224
  bind 0.0.0.0

  # Uncomment for TLS encryption between Fluent Bit and Fluentd
  # <transport tls>
  #   cert_path /fluentd/certs/fluentd.crt
  #   private_key_path /fluentd/certs/fluentd.key
  #   client_cert_auth false
  # </transport>
</source>

# Add hostname and environment labels
<filter **>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment "production"
  </record>
</filter>

# Parse Apache access logs
<filter apache.access>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type apache2
  </parse>
</filter>

# Parse Apache error logs
<filter apache.error>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type multiline
    format_firstline /^\[[^ ]* [^ ]*\]/
    format1 /^\[(?<time>[^\]]*)\] \[(?<level>[^\]]*)\](?: \[pid (?<pid>[^\]]*)\])?( \[client (?<client>[^\]]*)\])? (?<message>.*)$/
  </parse>
</filter>

# Route to Loki with TLS support
<match **>
  @type loki
  url http://loki:3100

  # For TLS to Loki, change to https and add:
  # url https://loki:3100
  # ca_cert /path/to/ca.crt
  # insecure_tls false

  extra_labels {"environment":"production"}

  <label>
    job $.job
    hostname $.hostname
  </label>

  <buffer>
    @type file
    path /var/log/fluentd/buffer
    flush_mode interval
    flush_interval 10s
    flush_at_shutdown true
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_interval 60s
  </buffer>
</match>
